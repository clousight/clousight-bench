[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clousight-bench"
version = "0.2.0"
description = "Clousight Bench (指北测评): reproducible, evidence-graded benchmarking for cloud products."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Clousight Bench contributors" }]
keywords = ["benchmark", "cloud", "clousight", "agent-runtime", "emr", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
store = ["duckdb>=1.0", "pyarrow>=16"]

[project.scripts]
csbench = "clousight_bench.cli:main"

[project.entry-points."clousight_bench.domains"]
agent-runtime = "clousight_bench.domains.agent_runtime:AgentRuntimeDomain"
bigdata-emr = "clousight_bench.domains.bigdata_emr:BigDataEmrDomain"

[tool.hatch.build.targets.wheel]
packages = ["src/clousight_bench"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
