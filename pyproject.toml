[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencloudbench"
version = "0.1.0"
description = "Reproducible, evidence-graded benchmarking framework for cloud products (agent runtimes, big data, databases, compute, messaging)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenCloudBench contributors" }]
keywords = ["benchmark", "cloud", "agent-runtime", "emr", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ocb = "opencloudbench.cli:main"

[project.entry-points."opencloudbench.domains"]
agent-runtime = "opencloudbench.domains.agent_runtime:AgentRuntimeDomain"
bigdata-emr = "opencloudbench.domains.bigdata_emr:BigDataEmrDomain"

[tool.hatch.build.targets.wheel]
packages = ["src/opencloudbench"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
