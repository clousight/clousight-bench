[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clousight-bench"
version = "0.5.0"
description = "Clousight Bench: reproducible, reproducibility-classed benchmarking for cloud products."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Clousight Bench contributors" }]
keywords = ["benchmark", "cloud", "clousight", "agent-runtime", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    # OTel-native tracing backbone (traces only). The OTLP push exporter lives
    # in the [otlp] extra so protobuf stays optional.
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]

[project.urls]
Homepage = "https://clousight.com"
Repository = "https://github.com/clousight/clousight-bench"
Issues = "https://github.com/clousight/clousight-bench/issues"
Changelog = "https://github.com/clousight/clousight-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.22",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
# In-region data-plane probe (cb-probe server + OSS telemetry sink). The core
# and CLI never import the probe subpackage, so a bare install stays minimal;
# these are only needed to run/host a probe.
probe = ["requests>=2.28", "oss2>=2.18"]
# OTLP/HTTP push exporter: set CLOUSIGHT_OTLP_ENDPOINT to ship run traces to a
# collector (Jaeger/Tempo/ARMS/X-Ray ...).
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
# Benchmark agent bundle: LangChain + OpenInference + OTel. These are vendored
# into the deployable agent zip by the artifact builder; installed here only to
# build/run the agent in-process. Core/CLI never import the agent bundle.
agent = [
    "langchain==0.3.*",
    "langchain-core==0.3.*",
    "openinference-instrumentation-langchain",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]
# Live Aliyun AgentRun provider SDKs. Optional: the provider registers and the
# mock/seam paths work without them; only live cloud calls need them installed.
aliyun = [
    "alibabacloud-agentrun20250910",
    "alibabacloud-tea-openapi",
    "alibabacloud-credentials",
    "oss2",
    "alibabacloud-arms20190808",
    "alibabacloud-ecs20140526",
    "alibabacloud-vpc20160428",  # controller self-destruct reaper: delete NAT + release EIP
    "alibabacloud-eci20180808",  # csbench sweep: reap orphaned ECI container groups
    "requests>=2.28",
]
# EXPERIMENTAL (preview). The AWS Bedrock AgentCore provider is not yet live-wired:
# it registers and the mock/seam paths work, but live cloud calls raise
# CapabilityNotSupported. Installing this extra pulls the SDK for the mock/seam
# paths only. The aliyun provider is the supported live backend today.
aws = [
    "boto3>=1.34",
    "requests>=2.28",
]
store = ["duckdb>=1.0", "pyarrow>=16"]
# TPC-DS reference engine: DuckDB + its tpcds extension power the duckdb-local
# data-warehouse adapter (schema/data generation + query set). Same duckdb pin
# as [store].
tpcds = ["duckdb>=1.0"]
# TPC-H reference engine: DuckDB + its tpch extension power the duckdb-local
# data-warehouse adapter (schema/data generation + 22 queries). Same duckdb pin.
tpch = ["duckdb>=1.0"]
validate = ["jsonschema>=4.20"]
# LLM endpoint path: the mmlu/gsm8k/human-eval `llm-endpoint` real run and the
# openai-compatible judge POST to /chat/completions via `requests`. Required only
# for the real endpoint path; mock / reference paths need nothing.
llm = ["requests>=2.28"]
# Upstream SWE-bench evaluation harness. Required only for the real Docker-backed
# run() path; mock_artifacts() and resolve() work without it.
swebench = ["swebench>=3.0"]

[project.scripts]
csbench = "clousight_bench.cli:main"
cb-probe = "clousight_bench.domains.agent_runtime.probe.agent_loop:main"
cb-controller = "clousight_bench.core.campaign.controller_main:main"

[project.entry-points.pytest11]
clousight_bench = "clousight_bench.pytest_plugin"

[project.entry-points."clousight_bench.benchmark_suites"]
swe-bench = "clousight_bench.suites.swe_bench.suite:SweBenchSuite"
swe-bench-lite = "clousight_bench.suites.swe_bench_lite.suite:SweBenchLiteSuite"
swe-bench-multimodal = "clousight_bench.suites.swe_bench_multimodal.suite:SweBenchMultimodalSuite"
tpc-ds = "clousight_bench.suites.tpc_ds.suite:TpcdsSuite"
tpc-h = "clousight_bench.suites.tpc_h.suite:TpchSuite"
ycsb = "clousight_bench.suites.ycsb.suite:YcsbSuite"
tpc-c = "clousight_bench.suites.tpc_c.suite:TpccSuite"
mmlu = "clousight_bench.suites.mmlu.suite:MmluSuite"
gsm8k = "clousight_bench.suites.gsm8k.suite:Gsm8kSuite"
human-eval = "clousight_bench.suites.human_eval.suite:HumanEvalSuite"

[project.entry-points."clousight_bench.domains"]
agent-runtime = "clousight_bench.domains.agent_runtime:AgentRuntimeDomain"
data-warehouse = "clousight_bench.domains.data_warehouse:DataWarehouseDomain"
key-value = "clousight_bench.domains.key_value:KeyValueDomain"
transactional-db = "clousight_bench.domains.transactional_db:TransactionalDbDomain"
llm = "clousight_bench.domains.llm:LlmDomain"

[project.entry-points."clousight_bench.evaluators"]
official-swe-evaluator = "clousight_bench.suites.swe_bench.evaluator:OfficialSweEvaluator"
official-swe-lite-evaluator = "clousight_bench.suites.swe_bench_lite.evaluator:OfficialSweLiteEvaluator"
official-swe-multimodal-evaluator = "clousight_bench.suites.swe_bench_multimodal.evaluator:OfficialSweMultimodalEvaluator"
official-tpch-evaluator = "clousight_bench.suites.tpc_h.evaluator:OfficialTpchEvaluator"
official-tpch-qphh-evaluator = "clousight_bench.suites.tpc_h.official_evaluator:OfficialTpchQphhEvaluator"
official-ycsb-evaluator = "clousight_bench.suites.ycsb.evaluator:OfficialYcsbEvaluator"
official-tpcc-evaluator = "clousight_bench.suites.tpc_c.evaluator:OfficialTpccEvaluator"
official-mmlu-evaluator = "clousight_bench.suites.mmlu.evaluator:OfficialMmluEvaluator"
official-gsm8k-evaluator = "clousight_bench.suites.gsm8k.evaluator:OfficialGsm8kEvaluator"
official-tpcds-evaluator = "clousight_bench.suites.tpc_ds.evaluator:OfficialTpcdsEvaluator"
official-tpcds-qphds-evaluator = "clousight_bench.suites.tpc_ds.official_evaluator:OfficialTpcdsQphdsEvaluator"
official-humaneval-evaluator = "clousight_bench.suites.human_eval.evaluator:OfficialHumanEvalEvaluator"

[project.entry-points."clousight_bench.metrics"]
answered-rate = "clousight_bench.metrics.answered_rate:AnsweredRateMetric"
response-quality = "clousight_bench.metrics.response_quality:ResponseQualityMetric"

[project.entry-points."clousight_bench.judges"]
openai-compatible = "clousight_bench.judges.openai_compatible:OpenAiCompatibleJudgeProvider"

[project.entry-points."clousight_bench.enrichers"]
pricing = "clousight_bench.enrichers.pricing:PricingEnricher"

[project.entry-points."clousight_bench.runtime_providers"]
aliyun = "clousight_bench.domains.agent_runtime.aliyun:AliyunRuntimeProvider"
aws = "clousight_bench.domains.agent_runtime.aws.provider:AwsRuntimeProvider"

[project.entry-points."clousight_bench.resource_reapers"]
aliyun = "clousight_bench.domains.agent_runtime.aliyun.reaper:AliyunResourceReaper"
aws = "clousight_bench.domains.agent_runtime.aws.reaper:AwsResourceReaper"

[tool.hatch.build.targets.wheel]
packages = ["src/clousight_bench"]
# `artifacts` only matters for files hatchling would otherwise EXCLUDE, i.e.
# git-ignored build products (the bundled viewer dist). All suites' fixtures/ are
# git-tracked and therefore ship in the wheel automatically — do NOT add per-suite
# fixture globs here (a partial list reads as "the others are excluded" when they
# are not; verified by building the wheel from a non-git tree).
artifacts = ["src/clousight_bench/resources/schemas/*.json",
             "src/clousight_bench/resources/viewer/dist/**",
             "src/clousight_bench/resources/brand/*.png",
             "src/clousight_bench/resources/brand/providers/*.svg"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use local (mid-file) imports for isolation and lambda
# fakes/factories; those are noise there, not a code-quality signal.
"tests/*" = ["E402", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast gate skips two buckets by default (locally and in the required CI
# matrix): `live` (real cloud/network, needs credentials) and `slow` (heavy
# real-sleep / timing-sensitive integration tests). Run them explicitly with
# `pytest -m live` or `pytest -m slow`; CI runs the slow bucket in a separate
# non-required job.
addopts = "-m 'not live and not slow'"
markers = [
  "real_registry: opt this test out of the autouse stub-task injection (sees the real zero-task domain)",
    "live: exercises a real cloud endpoint / network (needs credentials); skipped by default, run with -m live",
    "slow: heavy real-sleep / timing-sensitive integration test; skipped by the fast gate, run with -m slow",
]

[tool.mypy]
python_version = "3.10"
files = ["src/clousight_bench"]
# Workload scripts are standalone executables, not importable modules
# (two are both named `run.py`), so they are checked by ruff, not mypy.
# _vendor_cache is a gitignored build product (LangChain + OTel), not our code.
exclude = [
    "src/clousight_bench/resources/workloads/",
    "_vendor_cache/",
]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# lc_agent is a thin wrapper over LangChain, whose BaseTool/agent types are
# notoriously hard to satisfy under mypy. Typing it is tracked as a follow-up;
# it is exercised end-to-end by the agent tests.
module = ["clousight_bench.domains.agent_runtime.agent_bundle.lc_agent"]
ignore_errors = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["clousight_bench"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
