name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR) so we
# don't burn runners finishing a run whose result no longer matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the whole matrix when one cell fails — a single flaky cell
      # shouldn't hide the other versions' results or block the PR by itself.
      # (The 4 cells run in parallel, so this costs no extra wall-clock.)
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store,validate,probe,agent,aliyun,tpcds,tpch]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Docs inventory up to date
        run: python scripts/gen_docs.py --check

      - name: Test (pytest)
        # --durations surfaces the slowest tests in the log so CI-time regressions
        # (e.g. a test doing real network I/O with long timeouts) are easy to spot.
        run: pytest -q --durations=15 --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        continue-on-error: true  # coverage upload is best-effort; a Codecov token/outage must never gate merges
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Conformance smoke (built-in domains + suites)
        run: |
          csbench conformance --domain agent-runtime --platform local-sim
          csbench conformance --domain data-warehouse --platform duckdb-local
          csbench conformance --domain key-value --platform ycsb-local
          csbench conformance --domain transactional-db --platform benchbase-local
          csbench conformance --domain llm --platform llm-mock
          csbench conformance --suite swe-bench
          csbench conformance --suite swe-bench-lite
          csbench conformance --suite swe-bench-multimodal
          csbench conformance --suite tpc-ds
          csbench conformance --suite tpc-h
          csbench conformance --suite ycsb
          csbench conformance --suite tpc-c
          csbench conformance --suite mmlu
          csbench conformance --suite gsm8k
          csbench conformance --suite human-eval

      - name: Local baseline smoke (no cloud account)
        # The suite-first world runs `suite:<id>` jobs; `target: {mode: mock}`
        # drives the offline mock path (no cloud, no LLM key), emitting a real
        # schema-0.4 record the assertion step below reads. tpc-ds also gets a
        # real duckdb-local run of a 3-query SF1 subset (the [tpcds] extra ships
        # duckdb) to exercise the actual engine path, incl. the cross-platform
        # reference-digest match on linux.
        run: |
          csbench list --verbose
          printf 'target:\n  mode: mock\nparams: {}\n' > /tmp/mock.yaml
          csbench run --domain agent-runtime --task suite:swe-bench \
            --platform local-sim --config /tmp/mock.yaml
          csbench run --domain agent-runtime --task suite:swe-bench-lite \
            --platform local-sim --config /tmp/mock.yaml
          csbench run --domain agent-runtime --task suite:swe-bench-multimodal \
            --platform local-sim --config /tmp/mock.yaml
          csbench run --domain data-warehouse --task suite:tpc-ds \
            --platform duckdb-local --config /tmp/mock.yaml
          printf 'target:\n  mode: runtime\nparams:\n  scale_factor: 1\n  query_ids: [3, 7, 42]\n' > /tmp/tpcds-real.yaml
          csbench run --domain data-warehouse --task suite:tpc-ds \
            --platform duckdb-local --config /tmp/tpcds-real.yaml
          csbench run --domain data-warehouse --task suite:tpc-h \
            --platform duckdb-local --config /tmp/mock.yaml
          printf 'target:\n  mode: runtime\nparams:\n  scale_factor: 1\n  query_ids: [1, 6, 14]\n' > /tmp/tpch-real.yaml
          csbench run --domain data-warehouse --task suite:tpc-h \
            --platform duckdb-local --config /tmp/tpch-real.yaml
          # YCSB / TPC-C: offline mock only in CI (real paths need the YCSB /
          # BenchBase JVM tools, gated like SWE-bench's Docker path).
          csbench run --domain key-value --task suite:ycsb \
            --platform ycsb-local --config /tmp/mock.yaml
          csbench run --domain transactional-db --task suite:tpc-c \
            --platform benchbase-local --config /tmp/mock.yaml
          # MMLU: offline mock only in CI (the real path needs a managed LLM
          # endpoint + API key, config-connect via llm-endpoint).
          csbench run --domain llm --task suite:mmlu \
            --platform llm-mock --config /tmp/mock.yaml
          csbench run --domain llm --task suite:gsm8k \
            --platform llm-mock --config /tmp/mock.yaml
          # HumanEval: offline fixture path, PLUS a reference-execution run that
          # really runs the dataset's canonical solutions through the sandboxed
          # executor (no LLM, no network) — exercises the actual code-exec path.
          csbench run --domain llm --task suite:human-eval \
            --platform llm-mock --config /tmp/mock.yaml
          printf 'target:\n  mode: mock\nparams:\n  execute: true\n' > /tmp/humaneval-exec.yaml
          csbench run --domain llm --task suite:human-eval \
            --platform llm-mock --config /tmp/humaneval-exec.yaml

      - name: Assert every emitted record is schema 0.4
        run: |
          python - <<'PY'
          import json, pathlib
          # Scope to record files only: the suite run also writes raw evaluator
          # output under results/artifacts/** and plan aggregates under
          # results/aggregates/**, neither of which is a result record.
          paths = [
              p for p in pathlib.Path("results").rglob("*.json")
              if "artifacts" not in p.parts and "aggregates" not in p.parts
              and p.name not in {"comparison.json", "migration-manifest.json"}
          ]
          assert paths, "the smoke wrote no records"
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["schema_version"] == "0.4", (path, data["schema_version"])
              assert data["status"] in {
                  "completed", "failed", "invalid", "unsupported", "interrupted"
              }, (path, data["status"])
              assert data["fingerprints"]["record_digest"].startswith("sha256:"), path
              for gone in ("ok", "metrics", "evidence_layer", "config_hash"):
                  assert gone not in data, (path, gone)
          print(f"{len(paths)} records verified at schema 0.4")
          PY

      - name: Run plan aggregates repeats and drops warmups
        run: |
          rm -rf /tmp/plan-results
          printf 'target:\n  mode: mock\nparams: {}\n' > /tmp/mock.yaml
          csbench run --domain agent-runtime --task suite:swe-bench --platform local-sim \
            --config /tmp/mock.yaml --results /tmp/plan-results --repeat 3 --warmup 1
          python - <<'PY'
          import json, pathlib
          aggs = list(pathlib.Path("/tmp/plan-results/aggregates").rglob("*.json"))
          assert len(aggs) == 1, aggs
          data = json.loads(aggs[0].read_text(encoding="utf-8"))
          assert data["kind"] == "run_plan_aggregate"
          assert len(data["runs"]["measured"]) == 3, data["runs"]
          assert len(data["runs"]["warmup"]) == 1, data["runs"]
          assert data["status_counts"].get("completed") == 3, data["status_counts"]
          assert data["digest"].startswith("sha256:")
          # Four run records + one aggregate; warmups are excluded from the stats.
          # Exclude the aggregate itself AND the raw evaluator artifacts.
          recs = [p for p in pathlib.Path("/tmp/plan-results").rglob("*.json")
                  if "aggregates" not in p.parts and "artifacts" not in p.parts]
          assert len(recs) == 4, recs
          print("run plan: 4 records, 3 measured pooled, 1 warmup dropped")
          PY

  no-validate:
    # Prove the hand-written validation floor still rejects bad input when the
    # optional [validate] extra (jsonschema) is absent, so the fallback can't rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install without [validate]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"
      - name: Assert jsonschema is not installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("jsonschema") is None, "jsonschema must be absent here"
          print("jsonschema absent: exercising the hand-written fallback")
          PY
      - name: Test (pytest, fallback path)
        run: pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --wheel-dir dist --no-deps
      - name: Install wheel into isolated environment
        run: |
          python -m venv /tmp/csbench-wheel
          /tmp/csbench-wheel/bin/pip install dist/*.whl
      - name: Smoke installed wheel outside checkout
        working-directory: /tmp
        run: |
          /tmp/csbench-wheel/bin/python -c "import importlib.metadata as m, importlib.resources as r, clousight_bench as cb; assert cb.__version__ == m.version('clousight-bench'), (cb.__version__, m.version('clousight-bench')); assert cb.RESULT_SCHEMA_VERSION == '0.4', cb.RESULT_SCHEMA_VERSION; root = r.files('clousight_bench.resources.workloads'); reqs = [('wordcount-py', 'run.py'), ('gsm8k-stats', 'run.py'), ('ycsb-wrapper', 'run.sh')]; missing = [n for n, e in reqs if not (root.joinpath(n, 'manifest.yaml').is_file() and root.joinpath(n, e).is_file())]; assert not missing, missing; assert r.files('clousight_bench').joinpath('py.typed').is_file(), 'py.typed marker missing from wheel'; schemas = r.files('clousight_bench.resources').joinpath('schemas'); need = ['runspec.schema.json', 'workload-manifest.schema.json', 'result-record-0.4.schema.json']; smissing = [s for s in need if not schemas.joinpath(s).is_file()]; assert not smissing, smissing; print('wheel version + workloads + py.typed + schemas + schema 0.4 verified')"
          /tmp/csbench-wheel/bin/csbench list --verbose
          printf 'target:\n  mode: mock\nparams: {}\n' > /tmp/wheel-mock.yaml
          /tmp/csbench-wheel/bin/csbench run \
            --domain agent-runtime --task suite:swe-bench --platform local-sim \
            --config /tmp/wheel-mock.yaml --results /tmp/csbench-wheel-results
          # A completed suite:swe-bench mock run from the installed wheel, outside
          # the checkout, is the wheel smoke. Record integrity (schema 0.4 +
          # record_digest) is asserted in the `test` job's schema step above.

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Mintlify CLI
        run: npm i -g mint
      - name: Check for broken links
        run: mint broken-links
      - name: Docs inventory up to date
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python scripts/gen_docs.py --check

  viewer-dist:
    # The committed viewer dist/ must be the exact build of web/ — a stale
    # bundle silently shipping in the wheel is a release bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild viewer dist
        run: cd web && npm ci && npm run build
      - name: Committed dist must be byte-identical to the rebuild
        run: git diff --exit-code -- src/clousight_bench/resources/viewer/dist

  slow-tests:
    # The heavy real-sleep / timing-sensitive integration tests (`-m slow`), split
    # out of the required test matrix so the fast gate stays quick and their
    # timing flakiness never blocks a PR. NOT a required status check — it runs for
    # visibility; a red here is a signal to investigate, not a merge blocker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store,validate,probe,agent,aliyun]"
      - name: Slow / integration tests
        run: pytest -m slow -q --durations=10
