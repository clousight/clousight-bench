name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store,validate,probe,agent,aliyun]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Docs inventory up to date
        run: python scripts/gen_docs.py --check

      - name: Test (pytest)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        continue-on-error: true  # coverage upload is best-effort; a Codecov token/outage must never gate merges
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Conformance smoke (built-in domains)
        run: |
          csbench conformance --domain agent-runtime --platform local-sim
          csbench conformance --domain bigdata-emr --platform local-process

      - name: Local baseline smoke (no cloud account)
        run: |
          csbench list --verbose
          for task in T1.1 T1.2 T1.3 T2.1 T4.1 T4.2 T5.1 T5.2; do
            csbench run --domain agent-runtime --task "$task" --platform local-sim
          done
          csbench run --domain agent-runtime --task T1.3 --platform local-sim \
            --config configs/local-sim.fail-fast.yaml
          csbench run --domain bigdata-emr --task J1.1 --platform local-process
          csbench report

      - name: Assert every emitted record is schema 0.2
        run: |
          python - <<'PY'
          import json, pathlib
          paths = [p for p in pathlib.Path("results").rglob("*.json")
                   if p.name not in {"comparison.json", "migration-manifest.json"}]
          assert paths, "the smoke wrote no records"
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["schema_version"] == "0.2", (path, data["schema_version"])
              assert data["status"] in {"completed", "unsupported"}, (path, data["status"])
              assert data["fingerprints"]["record_digest"].startswith("sha256:"), path
              for gone in ("ok", "metrics", "evidence_layer", "config_hash"):
                  assert gone not in data, (path, gone)
          print(f"{len(paths)} records verified at schema 0.2")
          PY

      - name: Migration round-trip from schema 1.0
        run: |
          rm -rf /tmp/legacy /tmp/migrated /tmp/migrated-again
          mkdir -p /tmp/legacy/agent-runtime/local-sim
          cat > /tmp/legacy/agent-runtime/local-sim/T1.3-run-legacy.json <<'JSON'
          {"domain":"agent-runtime","task_id":"T1.3","platform":"local-sim",
           "run_id":"run-legacy","started_at":"2026-01-01T00:00:00Z",
           "finished_at":"2026-01-01T00:00:05Z","config_hash":"sha256:dead",
           "evidence_layer":"C","metrics":{"recovery_mode":"fail-fast"},
           "ok":true,"runner_version":"1.0.0","raw":{},"notes":"legacy",
           "schema_version":"1.0","series":{},"artifacts":[],"error":null}
          JSON
          csbench migrate-results /tmp/legacy --output /tmp/migrated
          csbench migrate-results /tmp/legacy --output /tmp/migrated-again
          diff -r /tmp/migrated /tmp/migrated-again
          csbench report --results /tmp/migrated
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path(
              "/tmp/migrated/agent-runtime/local-sim/T1.3-run-legacy.json"
          ).read_text(encoding="utf-8"))
          assert data["schema_version"] == "0.2"
          assert data["fingerprints"]["benchmark"] == "unknown"
          assert data["extensions"]["legacy"]["config_hash"] == "sha256:dead"
          print("migration is deterministic and idempotent")
          PY

      - name: Run plan aggregates repeats and drops warmups
        run: |
          rm -rf /tmp/plan-results
          csbench run --domain agent-runtime --task T1.3 --platform local-sim \
            --results /tmp/plan-results --repeat 3 --warmup 1
          python - <<'PY'
          import json, pathlib
          aggs = list(pathlib.Path("/tmp/plan-results/aggregates").rglob("*.json"))
          assert len(aggs) == 1, aggs
          data = json.loads(aggs[0].read_text(encoding="utf-8"))
          assert data["kind"] == "run_plan_aggregate"
          assert len(data["runs"]["measured"]) == 3, data["runs"]
          assert len(data["runs"]["warmup"]) == 1, data["runs"]
          assert data["measurements"]["total_attempts"]["n"] == 3
          assert data["digest"].startswith("sha256:")
          # Four run records + one aggregate; warmups are excluded from the stats.
          recs = [p for p in pathlib.Path("/tmp/plan-results").rglob("*.json")
                  if "aggregates" not in p.parts]
          assert len(recs) == 4, recs
          print("run plan: 4 records, 3 measured pooled, 1 warmup dropped")
          PY

  no-validate:
    # Prove the hand-written validation floor still rejects bad input when the
    # optional [validate] extra (jsonschema) is absent, so the fallback can't rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install without [validate]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"
      - name: Assert jsonschema is not installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("jsonschema") is None, "jsonschema must be absent here"
          print("jsonschema absent: exercising the hand-written fallback")
          PY
      - name: Test (pytest, fallback path)
        run: pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --wheel-dir dist --no-deps
      - name: Install wheel into isolated environment
        run: |
          python -m venv /tmp/csbench-wheel
          /tmp/csbench-wheel/bin/pip install dist/*.whl
      - name: Smoke installed wheel outside checkout
        working-directory: /tmp
        run: |
          /tmp/csbench-wheel/bin/python -c "import importlib.metadata as m, importlib.resources as r, clousight_bench as cb; assert cb.__version__ == m.version('clousight-bench'), (cb.__version__, m.version('clousight-bench')); assert cb.RESULT_SCHEMA_VERSION == '0.2', cb.RESULT_SCHEMA_VERSION; root = r.files('clousight_bench.resources.workloads'); reqs = [('wordcount-py', 'run.py'), ('gsm8k-stats', 'run.py'), ('ycsb-wrapper', 'run.sh')]; missing = [n for n, e in reqs if not (root.joinpath(n, 'manifest.yaml').is_file() and root.joinpath(n, e).is_file())]; assert not missing, missing; assert r.files('clousight_bench').joinpath('py.typed').is_file(), 'py.typed marker missing from wheel'; schemas = r.files('clousight_bench.resources').joinpath('schemas'); need = ['runspec.schema.json', 'workload-manifest.schema.json', 'result-record-0.2.schema.json']; smissing = [s for s in need if not schemas.joinpath(s).is_file()]; assert not smissing, smissing; print('wheel version + workloads + py.typed + schemas + schema 0.2 verified')"
          /tmp/csbench-wheel/bin/csbench list --verbose
          /tmp/csbench-wheel/bin/csbench run \
            --domain agent-runtime --task T1.3 --platform local-sim \
            --results /tmp/csbench-wheel-results
          /tmp/csbench-wheel/bin/csbench run \
            --domain bigdata-emr --task J1.1 --platform local-process \
            --results /tmp/csbench-wheel-results
          /tmp/csbench-wheel/bin/csbench report \
            --results /tmp/csbench-wheel-results

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
