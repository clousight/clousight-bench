name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Local baseline smoke (no cloud account)
        run: |
          csbench list --verbose
          for task in T1.2 T1.3 T2.1 T4.1 T4.2; do
            csbench run --domain agent-runtime --task "$task" --platform local-sim
          done
          csbench run --domain agent-runtime --task T1.3 --platform local-sim \
            --config configs/local-sim.fail-fast.yaml
          csbench run --domain bigdata-emr --task J1.1 --platform local-process
          csbench report

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --wheel-dir dist --no-deps
      - name: Install wheel into isolated environment
        run: |
          python -m venv /tmp/csbench-wheel
          /tmp/csbench-wheel/bin/pip install dist/*.whl
      - name: Smoke installed wheel outside checkout
        working-directory: /tmp
        run: |
          /tmp/csbench-wheel/bin/python -c "import importlib.metadata as m, importlib.resources as r, clousight_bench as cb; assert cb.__version__ == m.version('clousight-bench'), (cb.__version__, m.version('clousight-bench')); root = r.files('clousight_bench.resources.workloads'); reqs = [('wordcount-py', 'run.py'), ('gsm8k-stats', 'run.py'), ('ycsb-wrapper', 'run.sh')]; missing = [n for n, e in reqs if not (root.joinpath(n, 'manifest.yaml').is_file() and root.joinpath(n, e).is_file())]; assert not missing, missing; assert r.files('clousight_bench').joinpath('py.typed').is_file(), 'py.typed marker missing from wheel'; print('wheel version + packaged workloads + py.typed verified')"
          /tmp/csbench-wheel/bin/csbench list --verbose
          /tmp/csbench-wheel/bin/csbench run \
            --domain agent-runtime --task T1.3 --platform local-sim \
            --results /tmp/csbench-wheel-results
          /tmp/csbench-wheel/bin/csbench run \
            --domain bigdata-emr --task J1.1 --platform local-process \
            --results /tmp/csbench-wheel-results
          /tmp/csbench-wheel/bin/csbench report \
            --results /tmp/csbench-wheel-results

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
