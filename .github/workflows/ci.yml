name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

      - name: Local baseline smoke (no cloud account)
        run: |
          csbench list
          csbench run --domain agent-runtime --task T1.3 --platform local-sim
          csbench run --domain agent-runtime --task T1.3 --platform local-sim --config configs/local-sim.fail-fast.yaml
          csbench run --domain bigdata-emr --task J1.1 --platform local-process --config configs/bigdata-emr.local.yaml
          csbench report
