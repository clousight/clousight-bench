site_name: Clousight Bench
site_description: Reproducible, evidence-graded benchmarking for cloud products.
site_url: https://clousight.github.io/clousight-bench/
repo_url: https://github.com/clousight/clousight-bench
repo_name: clousight/clousight-bench
docs_dir: docs
copyright: Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Querying results: querying.md
  - Reporting: reporting.md
  - Dataset tiers: dataset-tiers.md
  - API reference: reference.md
  - Releasing: RELEASING.md
