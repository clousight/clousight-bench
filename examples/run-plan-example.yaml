# Example batch run plan for `csbench run-plan` (dev-only, no cloud account).
#
#   csbench run-plan examples/run-plan-example.yaml --results /tmp/plan
#
# `target: {mode: mock}` selects the suite's offline mock path (no cloud, no
# LLM key), so this example runs anywhere. Each task entry supports
# repeat/warmup/params; warmups are excluded from the pooled aggregate.
version: "1"
domain: agent-runtime
platform: local-sim
target:
  mode: mock
tasks:
  - task: "suite:swe-bench"
    repeat: 2
    warmup: 1
